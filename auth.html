<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-center space-y-6">

    <!-- قسم تبديل اللغة (عربي / English) -->
    <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-emerald-400">طُـيُـورِي</span>
        <div class="flex items-center gap-1 bg-[#1a2318] p-1 rounded-xl border border-emerald-900/40 text-[10px]">
            <button onclick="setLanguage('ar')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold shadow">عربي</button>
            <button onclick="setLanguage('en')" class="px-2.5 py-1 rounded-lg text-gray-400 hover:text-white">English</button>
        </div>
    </div>

    <!-- الشعار والعنوان -->
    <div class="text-center space-y-2">
        <div class="flex justify-center items-center gap-2">
            <i class="fa-solid fa-dove text-3xl text-emerald-400"></i>
            <h1 class="text-3xl font-black text-white tracking-wide">طُـيُـورِي</h1>
        </div>
        <p class="text-xs text-emerald-400 font-bold">بإدارة مهدي مرهون الشمري</p>
        <h2 class="text-lg font-bold text-white pt-2" id="login-title">تسجيل الدخول</h2>
        <p class="text-[11px] text-gray-400" id="login-sub">أهلاً بعودتك! سجل دخولك للمتابعة</p>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div class="custom-card p-5 rounded-3xl space-y-4 shadow-2xl">
        
        <!-- زر تسجيل الدخول المباشر عبر Google -->
        <button onclick="loginWithGoogle()" class="w-full py-3 bg-white hover:bg-gray-100 text-gray-900 rounded-xl font-bold shadow-lg flex items-center justify-center gap-3 text-xs transition-all">
            <i class="fa-brands fa-google text-red-500 text-sm"></i>
            <span id="google-btn-text">التسجيل / الدخول بواسطة Google مباشرة</span>
        </button>

        <div class="flex items-center my-2">
            <div class="flex-grow border-t border-emerald-900/40"></div>
            <span class="px-3 text-[10px] text-gray-500" id="or-text">أو بالطريقة التقليدية</span>
            <div class="flex-grow border-t border-emerald-900/40"></div>
        </div>

        <!-- حقل اسم المستخدم أو البريد -->
        <div class="space-y-1">
            <label class="text-[10px] text-emerald-400 block" id="label-user">البريد الإلكتروني أو اسم المستخدم</label>
            <input type="text" name="username" placeholder="example@domain.com" autocomplete="off" class="w-full p-3 rounded-xl bg-[#121811] border border-emerald-900 text-white text-xs">
        </div>

        <!-- حقل كلمة المرور -->
        <div class="space-y-1">
            <label class="text-[10px] text-emerald-400 block" id="label-pass">كلمة المرور</label>
            <input type="password" placeholder="••••••••" class="w-full p-3 rounded-xl bg-[#121811] border border-emerald-900 text-white text-xs">
        </div>

        <!-- زر الدخول -->
        <button onclick="window.location.href='main.html'" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-lg transition-all" id="btn-login">
            تسجيل الدخول
        </button>

        <div class="flex justify-between items-center text-[10px] text-gray-400 pt-1">
            <a href="#" class="hover:underline" id="link-forgot">نسيت كلمة المرور؟</a>
            <a href="#" class="hover:underline text-emerald-400 font-bold" id="link-register">ليس لديك حساب؟ سجل حساب جديد</a>
        </div>
    </div>

    <script>
        function loginWithGoogle() {
            alert('تم الدخول المباشر بواسطة حساب Google بنجاح!');
            window.location.href = 'main.html';
        }

        function setLanguage(lang) {
            if (lang === 'en') {
                document.documentElement.setAttribute('dir', 'ltr');
                document.getElementById('login-title').innerText = 'Sign In';
                document.getElementById('login-sub').innerText = 'Welcome back! Sign in to continue';
                document.getElementById('google-btn-text').innerText = 'Sign in / Up with Google directly';
                document.getElementById('or-text').innerText = 'Or standard login';
                document.getElementById('label-user').innerText = 'Email or Username';
                document.getElementById('label-pass').innerText = 'Password';
                document.getElementById('btn-login').innerText = 'Sign In';
                document.getElementById('link-forgot').innerText = 'Forgot Password?';
                document.getElementById('link-register').innerText = "Don't have an account? Register";
            } else {
                document.documentElement.setAttribute('dir', 'rtl');
                document.getElementById('login-title').innerText = 'تسجيل الدخول';
                document.getElementById('login-sub').innerText = 'أهلاً بعودتك! سجل دخولك للمتابعة';
                document.getElementById('google-btn-text').innerText = 'التسجيل / الدخول بواسطة Google مباشرة';
                document.getElementById('or-text').innerText = 'أو بالطريقة التقليدية';
                document.getElementById('label-user').innerText = 'البريد الإلكتروني أو اسم المستخدم';
                document.getElementById('label-pass').innerText = 'كلمة المرور';
                document.getElementById('btn-login').innerText = 'تسجيل الدخول';
                document.getElementById('link-forgot').innerText = 'نسيت كلمة المرور؟';
                document.getElementById('link-register').innerText = 'ليس لديك حساب؟ سجل حساب جديد';
            }
        }
    </script>

    <!-- سطر الربط المركزي -->
    <script src="app.js"></script>
</body>
</html>
