<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - إعدادات التطبيق ولوحة المالك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4 pb-20">

    <!-- رأس الصفحة -->
    <div class="flex items-center justify-between pb-2 border-b border-emerald-900/40">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='main.html'" class="w-10 h-10 rounded-2xl custom-card flex items-center justify-center text-emerald-400 text-sm shadow">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <h1 class="font-black text-sm text-white">إعدادات التطبيق ولوحة المالك</h1>
        </div>
    </div>

    <!-- بطاقة معلومات المالك -->
    <div class="custom-card p-4 rounded-3xl space-y-3 shadow-xl">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-emerald-600/20 border-2 border-emerald-500 text-emerald-400 flex items-center justify-center font-black text-base">
                    م
                </div>
                <div>
                    <h3 class="font-bold text-white text-xs">مهدي مرهون الشمري</h3>
                    <p class="text-[10px] text-emerald-400">مالك ومنشئ المنصة</p>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-800/40">مدير النظام</span>
        </div>
    </div>

    <!-- إعدادات النظام وتفضيلات المربي -->
    <div class="custom-card p-4 rounded-3xl space-y-3">
        <h3 class="font-bold text-xs text-gray-300 px-1">خيارات التحكم العام</h3>
        
        <div class="space-y-2">
            <div class="flex items-center justify-between p-3 rounded-2xl bg-[#121811] border border-emerald-900/30 text-xs">
                <span class="flex items-center gap-2.5 text-gray-300"><i class="fa-solid fa-bell text-emerald-400"></i> إشعارات التذكير بالفقس</span>
                <input type="checkbox" checked class="accent-emerald-500 w-4 h-4">
            </div>

            <div class="flex items-center justify-between p-3 rounded-2xl bg-[#121811] border border-emerald-900/30 text-xs">
                <span class="flex items-center gap-2.5 text-gray-300"><i class="fa-solid fa-language text-emerald-400"></i> لغة التطبيق الافتراضية</span>
                <span class="text-[10px] text-emerald-400 font-bold">العربية (Arabic)</span>
            </div>

            <div class="flex items-center justify-between p-3 rounded-2xl bg-[#121811] border border-emerald-900/30 text-xs">
                <span class="flex items-center gap-2.5 text-gray-300"><i class="fa-solid fa-database text-emerald-400"></i> النسخ الاحتياطي للبيانات</span>
                <button onclick="alert('تم حفظ النسخة الاحتياطية بنجاح')" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl font-bold">تصدير الآن</button>
            </div>
        </div>
    </div>

    <!-- زر العودة للرئيسية -->
    <button onclick="window.location.href='main.html'" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-xs shadow-lg transition-all">
        حفظ العودة للرئيسية
    </button>

    <script src="app.js"></script>
</body>
</html>
