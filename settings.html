<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - الإعدادات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.15); }
    </style>
</head>
<body class="pb-12 pt-4 px-4 max-w-md mx-auto min-h-screen space-y-4">

    <!-- رأس صفحة الإعدادات -->
    <div class="flex items-center justify-between px-1">
        <h2 class="font-black text-base text-white">الإعدادات</h2>
        <button onclick="window.location.href='main.html'" class="w-8 h-8 rounded-xl custom-card flex items-center justify-center text-xs text-emerald-400"><i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <!-- كارت الملف الشخصي -->
    <div class="custom-card p-4 rounded-3xl flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-emerald-500 text-black flex items-center justify-center font-black text-base shadow" id="settings-avatar">م</div>
            <div>
                <h4 class="font-bold text-xs text-white" id="settings-name">مهدي الشمري</h4>
                <p class="text-[10px] text-gray-400" id="settings-email">mahdialshmary7@gmail.com</p>
            </div>
        </div>
        <button class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white rounded-xl text-[10px] font-bold shadow">
            تعديل الملف
        </button>
    </div>

    <!-- لوحة تحكم المالك (تظهر لك فقط) -->
    <div id="admin-panel-box" class="custom-card p-4 rounded-3xl border border-amber-500/40 bg-amber-950/20 shadow-lg">
        <button onclick="openAdminModal()" class="w-full flex items-center justify-between text-xs font-bold text-amber-300">
            <span class="flex items-center gap-2"><i class="fa-solid fa-shield-halved text-amber-400"></i> لوحة تحكم المالك (عرض المشتركين)</span>
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
        </button>
    </div>

    <!-- قسم المظهر -->
    <div class="space-y-1.5">
        <span class="text-[11px] font-bold text-gray-400 px-1">المظهر</span>
        <div class="custom-card rounded-3xl divide-y divide-gray-800/40 text-xs">
            <div class="p-3.5 flex items-center justify-between">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-moon text-emerald-400"></i> الوضع الداكن</span>
                <input type="checkbox" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
            </div>
            <div class="p-3.5 flex items-center justify-between">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-circle-dot text-emerald-400"></i> زر الاختصارات العائم</span>
                <input type="checkbox" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
            </div>
            <div class="p-3.5 flex items-center justify-between cursor-pointer">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-globe text-emerald-400"></i> اللغة</span>
                <span class="text-gray-400 flex items-center gap-1">العربية <i class="fa-solid fa-chevron-left text-[10px]"></i></span>
            </div>
            <div class="p-3.5 flex items-center justify-between cursor-pointer">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-coins text-emerald-400"></i> العملة المفضلة</span>
                <span class="text-gray-400 flex items-center gap-1">د.ع <i class="fa-solid fa-chevron-left text-[10px]"></i></span>
            </div>
        </div>
    </div>

    <!-- قسم الإشعارات -->
    <div class="space-y-1.5">
        <span class="text-[11px] font-bold text-gray-400 px-1">الإشعارات</span>
        <div class="custom-card rounded-3xl divide-y divide-gray-800/40 text-xs">
            <div class="p-3.5 flex items-center justify-between">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-bell text-emerald-400"></i> تفعيل الإشعارات</span>
                <input type="checkbox" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
            </div>
            <div class="p-3.5 flex items-center justify-between">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-bowl-food text-emerald-400"></i> تذكيرات التغذية</span>
                <input type="checkbox" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
            </div>
        </div>
    </div>

    <!-- قسم البيانات والدعم -->
    <div class="space-y-1.5">
        <span class="text-[11px] font-bold text-gray-400 px-1">البيانات والدعم</span>
        <div class="custom-card rounded-3xl divide-y divide-gray-800/40 text-xs">
            <div class="p-3.5 flex items-center justify-between cursor-pointer">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-file-arrow-down text-emerald-400"></i> تصدير البيانات</span>
                <i class="fa-solid fa-chevron-left text-[10px] text-gray-400"></i>
            </div>
            <div class="p-3.5 flex items-center justify-between cursor-pointer">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-star text-emerald-400"></i> تقييم التطبيق</span>
                <i class="fa-solid fa-chevron-left text-[10px] text-gray-400"></i>
            </div>
            <div class="p-3.5 flex items-center justify-between">
                <span class="flex items-center gap-2 text-gray-300"><i class="fa-solid fa-code text-emerald-400"></i> إصدار التطبيق</span>
                <span class="text-gray-400 font-bold">v1.2.2</span>
            </div>
        </div>
    </div>

    <!-- زر الخروج -->
    <div class="pt-2">
        <button onclick="window.location.href='auth.html'" class="w-full py-3 custom-card rounded-2xl text-xs font-bold text-emerald-400 flex items-center justify-center gap-2 shadow">
            <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
        </button>
    </div>

    <!-- نافذة لوحة المالك المنبثقة -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="custom-card p-5 rounded-3xl w-full max-w-sm space-y-3 text-xs">
            <div class="flex justify-between items-center border-b border-emerald-900/40 pb-2">
                <h3 class="font-bold text-sm text-amber-400">لوحة المالك - قائمة المشتركين</h3>
                <button onclick="closeAdminModal()"><i class="fa-solid fa-xmark text-gray-400"></i></button>
            </div>
            <div id="users-list-container" class="space-y-1.5 max-h-48 overflow-y-auto text-gray-300">
                <div class="p-2 bg-[#121811] rounded-xl flex justify-between"><span>👤 مهدي الشمري</span><span>مالك التطبيق</span></div>
            </div>
            <button onclick="closeAdminModal()" class="w-full py-2.5 bg-emerald-700 text-white rounded-xl font-bold">إغلاق</button>
        </div>
    </div>

    <script>
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }
        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }
    </script>
<script src="app.js"></script>

</body>
</html>
