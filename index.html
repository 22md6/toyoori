<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - منصة إدارة الطيور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.2); }
        .logo-text-art {
            font-size: 38px;
            font-weight: 900;
            background: linear-gradient(135deg, #32ccbc 0%, #28c76f 50%, #fdeb71 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-6 relative">

    <!-- 1. شاشة تهيئة اللغة والعملة (Setup Screen) -->
    <div id="setup-screen" class="fixed inset-0 bg-[#121811] z-50 flex flex-col justify-between p-6">
        <div class="flex justify-between items-center">
            <button onclick="goToOnboarding()" class="text-xs text-emerald-400 font-bold">تخطي</button>
            <button class="text-xs text-emerald-400 font-bold">English <i class="fa-solid fa-globe"></i></button>
        </div>
        
        <div class="space-y-6 text-center my-auto">
            <!-- الشعار النصي المزخرف والراقي بدلاً من الصور -->
            <div class="space-y-1">
                <div class="logo-text-art">🕊️ طُـيُـورِي 🦜</div>
                <p class="text-[11px] text-emerald-400 font-bold tracking-widest">بإدارة مهدي مرهون الشمري</p>
            </div>

            <h2 class="text-xl font-black pt-2">تخصيص تطبيق طيوري</h2>
            <p class="text-xs text-emerald-400/80">اختر اللغة المفضلة والعملة لبدء استخدام التطبيق.</p>
            
            <div class="custom-card p-4 rounded-3xl space-y-3 text-xs text-right shadow-xl">
                <label class="font-bold text-emerald-300 block">اللغة</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectLang(this)" class="py-2.5 rounded-xl border border-emerald-900 bg-[#121811] text-gray-300 font-bold">English</button>
                    <button type="button" onclick="selectLang(this)" class="py-2.5 rounded-xl bg-emerald-600 text-white font-bold border border-emerald-400">العربية</button>
                </div>
                
                <label class="font-bold text-emerald-300 block pt-2">العملة المفضلة</label>
                <select class="w-full p-3 rounded-xl bg-[#121811] border border-emerald-900 text-white font-bold">
                    <option value="IQD">🇮🇶 IQD (دينار عراقي)</option>
                    <option value="SAR">🇸🇦 SAR (ريال سعودي)</option>
                    <option value="USD">💵 USD (دولار أمريكي)</option>
                </select>
            </div>
        </div>

        <!-- زر المتابعة المفعل ببرمجة سليمة 100% -->
        <button onclick="goToOnboarding()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold shadow-2xl transition-all">متابعة</button>
    </div>

    <!-- 2. شاشات الترحيب (Onboarding) مخفاءة مؤقتاً لتظهر بعد الضغط على متابعة -->
    <div id="onboarding-screen" class="fixed inset-0 bg-[#121811] z-40 hidden flex flex-col justify-between p-6">
        <div class="text-center my-auto space-y-4">
            <div class="logo-text-art">🕊️ طُـيُـورِي 🦜</div>
            <h1 class="text-2xl font-black">مرحباً بك في منصة طيوري</h1>
            <p class="text-xs text-gray-400">إدارة شاملة وذكية للطيور والأقفاص والتفريخ والجينات باحترافية عالية.</p>
        </div>
        <button onclick="goToAuth()" class="w-full py-3.5 bg-emerald-600 text-white rounded-2xl font-bold shadow-xl">تسجيل الدخول</button>
    </div>

    <script>
        function selectLang(btn) {
            let parent = btn.parentElement;
            parent.querySelectorAll('button').forEach(b => {
                b.className = "py-2.5 rounded-xl border border-emerald-900 bg-[#121811] text-gray-300 font-bold";
            });
            btn.className = "py-2.5 rounded-xl bg-emerald-600 text-white font-bold border border-emerald-400";
        }

        function goToOnboarding() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('onboarding-screen').classList.remove('hidden');
        }

        function goToAuth() {
            alert('جاهزون للانتقال لواجهة تسجيل الدخول والشاشة الرئيسية!');
        }
    </script>
</body>
</html>
