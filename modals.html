<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - أدوات المربي والحاسبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4 pb-20">

    <!-- رأس الصفحة -->
    <div class="flex items-center justify-between pb-2 border-b border-emerald-900/40">
        <div class="flex items-center gap-2">
            <button onclick="window.location.href='main.html'" class="w-10 h-10 rounded-2xl custom-card flex items-center justify-center text-emerald-400 text-sm shadow">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <h1 class="font-black text-sm text-white">حاسبات وأدوات المربي الذكية</h1>
        </div>
    </div>

    <!-- بطاقة حاسبة الجينات والألوان -->
    <div class="custom-card p-4 rounded-3xl space-y-3 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm font-bold">
                <i class="fa-solid fa-calculator"></i>
            </div>
            <div>
                <h3 class="font-bold text-xs text-white">حاسبة الجينات والألوان</h3>
                <p class="text-[10px] text-gray-400">توقع طفرات وألوان الفراخ بدقة عالية</p>
            </div>
        </div>
        <button onclick="alert('جارٍ فتح حاسبة الجينات التفاعلية...')" class="w-full py-2.5 bg-[#121811] hover:bg-emerald-950/40 text-emerald-400 border border-emerald-900/40 rounded-xl text-xs font-bold transition-all">
            تشغيل الحاسبة
        </button>
    </div>

    <!-- بطاقة حاسبة حضانة البيض والفقس -->
    <div class="custom-card p-4 rounded-3xl space-y-3 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-sm font-bold">
                <i class="fa-solid fa-egg"></i>
            </div>
            <div>
                <h3 class="font-bold text-xs text-white">حاسبة حضانة البيض والفقس</h3>
                <p class="text-[10px] text-gray-400">حساب الأيام المتبقية لفقس البيض</p>
            </div>
        </div>
        <button onclick="alert('جارٍ فتح عداد حضانة البيض...')" class="w-full py-2.5 bg-[#121811] hover:bg-emerald-950/40 text-amber-400 border border-emerald-900/40 rounded-xl text-xs font-bold transition-all">
            فتح العداد الزمني
        </button>
    </div>

    <!-- بطاقة دليل الأمراض والأدوية -->
    <div class="custom-card p-4 rounded-3xl space-y-3 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-sm font-bold">
                <i class="fa-solid fa-book-medical"></i>
            </div>
            <div>
                <h3 class="font-bold text-xs text-white">دليل الأمراض والأدوية</h3>
                <p class="text-[10px] text-gray-400">استشر العلاجات المعتمدة لأمراض الطيور</p>
            </div>
        </div>
        <button onclick="alert('جارٍ فتح دليل الأدوية الطبية...')" class="w-full py-2.5 bg-[#121811] hover:bg-emerald-950/40 text-purple-400 border border-emerald-900/40 rounded-xl text-xs font-bold transition-all">
            استعراض الدليل
        </button>
    </div>

    <!-- زر العودة للرئيسية -->
    <button onclick="window.location.href='main.html'" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-bold text-xs shadow-lg transition-all">
        العودة للرئيسية
    </button>

    <script src="app.js"></script>
</body>
</html>
