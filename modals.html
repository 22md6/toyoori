<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - القوائم المنسدلة والنوافذ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4">

    <!-- 1. القائمة المنسدلة الجانبية (Sidebar Drawer) -->
    <div id="sidebar-drawer" class="custom-card p-5 rounded-3xl space-y-4 text-xs">
        <div class="flex items-center justify-between border-b border-emerald-900/40 pb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500 text-black flex items-center justify-center font-black text-sm">م</div>
                <div>
                    <h3 class="font-bold text-white text-sm">مهدي الشمري</h3>
                    <p class="text-[10px] text-emerald-400">مربي محترف</p>
                </div>
            </div>
            <button class="text-gray-400 text-base"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="space-y-2">
            <span class="text-[10px] text-gray-400 font-bold block">الأدوات والحاسبات</span>
            <button onclick="openModal('genetics-modal')" class="w-full flex items-center justify-between p-3 rounded-2xl bg-[#121811] hover:bg-emerald-950/40 text-emerald-300">
                <span class="flex items-center gap-2"><i class="fa-solid fa-calculator"></i> حاسبة الجينات والطفرات</span>
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
            </button>
            <button onclick="openModal('hatch-modal')" class="w-full flex items-center justify-between p-3 rounded-2xl bg-[#121811] hover:bg-emerald-950/40 text-amber-300">
                <span class="flex items-center gap-2"><i class="fa-solid fa-egg"></i> حاسبة حضانة البيض والفقس</span>
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
            </button>
            <button onclick="openModal('diseases-modal')" class="w-full flex items-center justify-between p-3 rounded-2xl bg-[#121811] hover:bg-emerald-950/40 text-purple-300">
                <span class="flex items-center gap-2"><i class="fa-solid fa-book-medical"></i> دليل الأمراض والأدوية</span>
                <i class="fa-solid fa-chevron-left text-[10px]"></i>
            </button>
        </div>
    </div>

    <!-- 2. النافذة المنبثقة: حاسبة الجينات والألوان -->
    <div id="genetics-modal" class="custom-card p-5 rounded-3xl space-y-3 text-xs">
        <div class="flex justify-between items-center border-b border-emerald-900/40 pb-2">
            <h3 class="font-bold text-sm text-emerald-300"><i class="fa-solid fa-calculator"></i> حاسبة الجينات والألوان</h3>
            <button onclick="closeModal('genetics-modal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-2">
            <label class="text-[10px] text-gray-400 block">نوع الطائر</label>
            <select class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
                <option value="budgie">بادجي (Budgie)</option>
                <option value="canary">كناري (Canary)</option>
                <option value="cockatiel">كوكتيل (Cockatiel)</option>
            </select>
            
            <label class="text-[10px] text-gray-400 block">طفرة الأب</label>
            <select class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
                <option>عادي (Normal)</option>
                <option>لوتينو (Lutino)</option>
            </select>

            <label class="text-[10px] text-gray-400 block">طفرة الأم</label>
            <select class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
                <option>عادي (Normal)</option>
                <option>ألبينو (Albino)</option>
            </select>

            <button class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">احسب المتوقع للفروخ</button>
        </div>
    </div>

    <!-- 3. النافذة المنبثقة: حاسبة حضانة البيض والفقس -->
    <div id="hatch-modal" class="custom-card p-5 rounded-3xl space-y-3 text-xs">
        <div class="flex justify-between items-center border-b border-emerald-900/40 pb-2">
            <h3 class="font-bold text-sm text-amber-300"><i class="fa-solid fa-egg"></i> حاسبة الفقس والتفقيس</h3>
            <button onclick="closeModal('hatch-modal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-2">
            <label class="text-[10px] text-gray-400 block">نوع الطائر</label>
            <select class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
                <option value="18">بادجي - 18 يوم</option>
                <option value="14">كناري - 14 يوم</option>
                <option value="21">كوكتيل - 21 يوم</option>
            </select>
            <label class="text-[10px] text-gray-400 block">تاريخ وضع البيضة</label>
            <input type="date" class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
            <button class="w-full py-3 bg-amber-600 text-white font-bold rounded-xl shadow">احسب مواعيد التفقيس والدبلة</button>
        </div>
    </div>

    <!-- 4. النافذة المنبثقة: إضافة طائر جديد -->
    <div id="add-bird-modal" class="custom-card p-5 rounded-3xl space-y-3 text-xs">
        <div class="flex justify-between items-center border-b border-emerald-900/40 pb-2">
            <h3 class="font-bold text-sm text-emerald-300"><i class="fa-solid fa-plus"></i> إضافة طائر جديد</h3>
            <button onclick="closeModal('add-bird-modal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-2">
            <input type="text" placeholder="رقم الحلقة أو اسم الطائر" class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
            <select class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
                <option>ذكر ♂</option>
                <option>أنثى ♀</option>
            </select>
            <select class="w-full p-2.5 rounded-xl bg-[#121811] border border-emerald-900 text-white">
                <option>اختر القفص</option>
                <option>بدون قفص</option>
            </select>
            <button class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">حفظ الطائر</button>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
<script src="app.js"></script>

</body>
</html>
