<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طيوري - الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #121811; color: #ffffff; }
        .custom-card { background-color: #1a2318; border: 1px solid rgba(16, 185, 129, 0.2); }
        .info-hero-bg { background: linear-gradient(135deg, #0d2818 0%, #121811 100%); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto space-y-4 pb-28">

    <!-- رأس الصفحة العلوي -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <button onclick="openSideMenu()" class="w-10 h-10 rounded-2xl custom-card flex items-center justify-center text-emerald-400 text-sm shadow hover:bg-emerald-950/50">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <button class="w-10 h-10 rounded-2xl custom-card flex items-center justify-center text-gray-300 text-sm shadow">
                <i class="fa-regular fa-bell"></i>
            </button>
        </div>
        
        <div class="text-left">
            <span class="text-[10px] text-gray-400 block">طاب يومك</span>
            <span class="font-bold text-xs text-white" id="user-display-name">مهدي مرهون الشمري</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-600 text-black flex items-center justify-center font-black text-sm shadow">
            م
        </div>
    </div>

    <!-- بطاقات الإحصائيات الفاخرة -->
    <div class="grid grid-cols-2 gap-3">
        <div class="custom-card p-4 rounded-3xl space-y-2">
            <div class="flex justify-between items-center text-emerald-400">
                <i class="fa-solid fa-feather text-base"></i>
                <span class="text-[10px] bg-emerald-950 px-2.5 py-0.5 rounded-full text-emerald-300 font-bold">نشط</span>
            </div>
            <div>
                <span class="block text-2xl font-black text-white" id="active-birds-count">0</span>
                <span class="text-[11px] text-gray-400">إجمالي الطيور النشطة</span>
            </div>
        </div>

        <div class="custom-card p-4 rounded-3xl space-y-2">
            <div class="flex justify-between items-center text-purple-400">
                <i class="fa-solid fa-egg text-base"></i>
                <span class="text-[10px] bg-purple-950 px-2.5 py-0.5 rounded-full text-purple-300 font-bold">الإنتاج</span>
            </div>
            <div>
                <span class="block text-2xl font-black text-white">0</span>
                <span class="text-[11px] text-gray-400">أفرخ</span>
            </div>
        </div>
    </div>

    <!-- قسم مهام اليوم والتصاميم السابقة -->
    <div class="custom-card p-4 rounded-3xl space-y-2">
        <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-gray-300">مهام اليوم</span>
            <span class="text-emerald-400"><i class="fa-solid fa-plus"></i></span>
        </div>
        <div class="bg-[#121811] p-3 rounded-2xl border border-emerald-900/30 text-center text-gray-400 text-xs">
            لا توجد مهام اليوم. استمتع بيومك!
        </div>
    </div>

    <!-- بطاقة شركاء النجاح -->
    <div class="info-hero-bg p-4 rounded-3xl border border-amber-500/30 shadow-xl flex items-center justify-between text-xs">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-sm">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
                <h3 class="font-bold text-white">شركاء النجاح</h3>
                <p class="text-[10px] text-gray-300">تعرف على شركاء النجاح المساهمين في دعم التطبيق</p>
            </div>
        </div>
        <i class="fa-solid fa-chevron-left text-gray-400"></i>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto custom-card border-t border-emerald-900/30 px-6 py-2.5 flex justify-between items-center z-30 text-[10px] bg-[#121811]">
        <button onclick="window.location.href='market-add.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
            <i class="fa-solid fa-store text-sm"></i><span>السوق</span>
        </button>
        <button onclick="window.location.href='community.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
            <i class="fa-solid fa-users text-sm"></i><span>المجتمع</span>
        </button>
        <div class="relative -top-3">
            <button onclick="window.location.href='modals.html'" class="w-12 h-12 bg-emerald-500 text-black rounded-full shadow-xl flex items-center justify-center text-lg font-black border-4 border-[#121811]">
                <i class="fa-solid fa-qrcode"></i>
            </button>
        </div>
        <button onclick="window.location.href='info.html'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
            <i class="fa-solid fa-book text-sm"></i><span>الدليل</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-emerald-400 font-bold">
            <i class="fa-solid fa-house text-sm"></i><span>الرئيسية</span>
        </button>
    </nav>

    <!-- القائمة الجانبية المنفصلة (Sidebar Drawer) -->
    <div id="side-menu-drawer" class="fixed inset-0 bg-black/85 z-50 hidden flex justify-end transition-all">
        <div class="w-4/5 max-w-xs bg-[#121811] h-full p-4 space-y-4 text-xs overflow-y-auto hide-scrollbar border-l border-emerald-900/40 shadow-2xl">
            
            <!-- الهيدر ومعلومات المستخدم الديناميكية (يأخذ اسمك تلقائياً) -->
            <div class="flex items-center justify-between border-b border-emerald-900/40 pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-11 h-11 rounded-full bg-emerald-900/40 border-2 border-emerald-500 text-emerald-400 flex items-center justify-center font-black text-sm">
                        م
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-xs" id="drawer-username">مهدي مرهون الشمري</h3>
                        <p class="text-[10px] text-emerald-400">عضو مجتمع طيوري</p>
                    </div>
                </div>
                <button onclick="closeSideMenu()" class="text-gray-400 text-lg hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- إحصائيات مصغرة -->
            <div class="grid grid-cols-3 gap-1.5 bg-[#1a2318] p-2.5 rounded-2xl border border-emerald-900/40 text-center">
                <div>
                    <span class="block font-black text-xs text-white">0</span>
                    <span class="text-[8px] text-amber-400"><i class="fa-solid fa-egg"></i> أزواج</span>
                </div>
                <div class="border-x border-emerald-900/40">
                    <span class="block font-black text-xs text-white">0</span>
                    <span class="text-[8px] text-blue-400"><i class="fa-solid fa-snowflake"></i> أقفاص</span>
                </div>
                <div>
                    <span class="block font-black text-xs text-white">0</span>
                    <span class="text-[8px] text-emerald-400"><i class="fa-solid fa-feather"></i> طيور</span>
                </div>
            </div>

            <!-- الأقسام والخيارات -->
            <div class="space-y-1.5">
                <span class="text-[9px] text-gray-400 font-bold block px-1">أدوات الإنتاج والجينات</span>
                <button onclick="alert('حاسبة الجينات')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-calculator text-emerald-400"></i> حاسبة الجينات والألوان</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="alert('حاسبة الفقس')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-amber-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-egg text-amber-400"></i> حاسبة حضانة البيض والفقس</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="alert('دليل الأمراض')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-purple-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-book-medical text-purple-400"></i> دليل الأمراض والأدوية</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="alert('خريطة العيادات')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-map-location-dot text-emerald-400"></i> خريطة عيادات الطيور</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="alert('تصدير Excel')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-file-excel text-emerald-400"></i> تصدير بيانات المزرعة (Excel)</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
            </div>

            <div class="space-y-1.5 pt-1">
                <span class="text-[9px] text-gray-400 font-bold block px-1">خدماتي وإعلاناتي</span>
                <button onclick="alert('الطيور المفقودة')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-crow text-emerald-400"></i> الطيور المفقودة</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="window.location.href='market-add.html'" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-store text-emerald-400"></i> إعلاناتي في سوق الطيور</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="alert('طلباتي')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-emerald-400"></i> طلباتي</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
            </div>

            <div class="space-y-1.5 pt-1">
                <span class="text-[9px] text-gray-400 font-bold block px-1">الإعدادات والدعم</span>
                <button onclick="window.location.href='settings.html'" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-gear text-emerald-400"></i> إعدادات التطبيق</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="alert('الدعم الفني')" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-headset text-emerald-400"></i> اتصل بنا للدعم الفني</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
                <button onclick="window.location.href='info.html'" class="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#1a2318] text-emerald-300">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-circle-info text-emerald-400"></i> عن التطبيق (من نحن)</span>
                    <i class="fa-solid fa-chevron-left text-[9px] text-gray-500"></i>
                </button>
            </div>

            <button onclick="alert('ترقية الحساب')" class="w-full py-3 bg-gradient-to-r from-amber-600 to-orange-600 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 text-xs">
                <i class="fa-solid fa-award"></i> ترقية الحساب إلى بريميوم
            </button>
            <button onclick="window.location.href='auth.html'" class="w-full py-2.5 bg-[#1a2318] text-red-400 border border-red-900/30 rounded-xl font-bold flex items-center justify-center gap-2 text-xs">
                <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
            </button>

        </div>
    </div>

    <script>
        function openSideMenu() { 
            // تحديث اسم المستخدم تلقائياً عند فتح القائمة من الذاكرة
            let savedUser = localStorage.getItem("toyoori_user") || "مهدي مرهون الشمري";
            let drawerUser = document.getElementById("drawer-username");
            if (drawerUser) drawerUser.innerText = savedUser;
            
            document.getElementById('side-menu-drawer').classList.remove('hidden'); 
        }
        function closeSideMenu() { 
            document.getElementById('side-menu-drawer').classList.add('hidden'); 
        }
    </script>
    <!-- سطر الربط المركزي -->
    <script src="app.js"></script>
</body>
</html>
